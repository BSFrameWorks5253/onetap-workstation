<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>

    <!-- Animated Shimmer Gradient for Main Title -->
    <linearGradient id="titleShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="25%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
      <animate attributeName="x1" from="-100%" to="100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="300%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(129, 140, 248, 0.25)" />
    </pattern>

    <!-- Wave Gradients -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-bg {
      animation: gridPulse 8s ease-in-out infinite alternate;
    }
    .hud-line {
      stroke-dasharray: 8 6;
      animation: dashMove 30s linear infinite;
    }
    .status-pulse {
      animation: pulseGreen 2s infinite;
    }
    .status-pulse-purple {
      animation: pulsePurple 2.2s infinite;
    }
    .status-pulse-cyan {
      animation: pulseCyan 1.8s infinite;
    }
    .scan-beam {
      animation: scanSweep 7s ease-in-out infinite;
    }
    .floating-wave-1 {
      animation: waveFloat1 6s ease-in-out infinite alternate;
    }
    .floating-wave-2 {
      animation: waveFloat2 8s ease-in-out infinite alternate;
    }

    @keyframes dashMove {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes pulseGreen {
      0%, 100% { fill: #10B981; opacity: 1; filter: drop-shadow(0 0 6px #10B981); }
      50% { fill: #34D399; opacity: 0.4; filter: drop-shadow(0 0 1px #10B981); }
    }
    @keyframes pulsePurple {
      0%, 100% { fill: #A855F7; opacity: 1; filter: drop-shadow(0 0 6px #A855F7); }
      50% { fill: #C084FC; opacity: 0.4; filter: drop-shadow(0 0 1px #A855F7); }
    }
    @keyframes pulseCyan {
      0%, 100% { fill: #06B6D4; opacity: 1; filter: drop-shadow(0 0 6px #06B6D4); }
      50% { fill: #22D3EE; opacity: 0.4; filter: drop-shadow(0 0 1px #06B6D4); }
    }
    @keyframes scanSweep {
      0% { transform: translateY(-100px); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.7; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes waveFloat1 {
      0% { transform: translateY(0px) scaleY(1); }
      100% { transform: translateY(-14px) scaleY(1.08); }
    }
    @keyframes waveFloat2 {
      0% { transform: translateY(0px) scaleY(1.05); }
      100% { transform: translateY(12px) scaleY(0.95); }
    }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGlow)" />

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" class="grid-bg" />

  <!-- Animated Glowing Sine Waves at Bottom -->
  <g class="floating-wave-2">
    <path d="M 0 310 C 250 270, 450 340, 700 295 C 950 250, 1100 320, 1200 300 L 1200 360 L 0 360 Z" fill="url(#wave2Grad)" />
  </g>
  <g class="floating-wave-1">
    <path d="M 0 325 C 200 280, 500 350, 750 310 C 1000 270, 1120 330, 1200 315 L 1200 360 L 0 360 Z" fill="url(#wave1Grad)" />
  </g>

  <!-- Laser Scanline Sweeper -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="rgba(129, 140, 248, 0.28)" stroke-width="2" class="scan-beam" filter="url(#neonGlow)" />

  <!-- Outer Tech Border & HUD Brackets -->
  <rect x="12" y="12" width="1176" height="336" rx="12" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5" />
  <rect x="18" y="18" width="1164" height="324" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 12 40 L 12 12 L 40 12" fill="none" stroke="#6366F1" stroke-width="3" />
  <path d="M 1188 40 L 1188 12 L 1160 12" fill="none" stroke="#6366F1" stroke-width="3" />
  <path d="M 12 320 L 12 348 L 40 348" fill="none" stroke="#6366F1" stroke-width="3" />
  <path d="M 1188 320 L 1188 348 L 1160 348" fill="none" stroke="#6366F1" stroke-width="3" />

  <!-- Top System Badge Chip -->
  <g transform="translate(600, 52)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" />
    <circle cx="-162" cy="0" r="4.5" class="status-pulse" />
    <text x="-144" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" letter-spacing="2.5">
      SYSTEM ONLINE // V26.10 WORKSTATION
    </text>
  </g>

  <!-- Main Hero Brand Title -->
  <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="64" font-weight="900" fill="url(#titleShimmer)" letter-spacing="4" filter="url(#neonGlow)">
    UNIDESK STUDIO
  </text>

  <!-- Tagline Subtitle -->
  <text x="600" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#E2E8F0" letter-spacing="6">
    AUTOMATED VIDEO PRODUCTION WORKSTATION &amp; BATCH ENGINE
  </text>

  <!-- Telemetry HUD Status Badges (4 Glass Pills) -->
  <g transform="translate(230, 248)">
    <rect x="-105" y="-16" width="210" height="32" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <circle cx="-85" cy="0" r="4" class="status-pulse" />
    <text x="-70" y="5" font-family="monospace" font-size="11" font-weight="700" fill="#6EE7B7" letter-spacing="1">NVENC GPU ACTIVE</text>
  </g>

  <g transform="translate(475, 248)">
    <rect x="-105" y="-16" width="210" height="32" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
    <circle cx="-85" cy="0" r="4" class="status-pulse-cyan" />
    <text x="-70" y="5" font-family="monospace" font-size="11" font-weight="700" fill="#67E8F9" letter-spacing="1">MULTI-BATCH 1..N</text>
  </g>

  <g transform="translate(720, 248)">
    <rect x="-105" y="-16" width="210" height="32" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
    <circle cx="-85" cy="0" r="4" class="status-pulse-purple" />
    <text x="-70" y="5" font-family="monospace" font-size="11" font-weight="700" fill="#D8B4FE" letter-spacing="1">~891K TOKENS SAVED</text>
  </g>

  <g transform="translate(965, 248)">
    <rect x="-105" y="-16" width="210" height="32" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(234, 179, 8, 0.4)" stroke-width="1" />
    <circle cx="-85" cy="0" r="4" fill="#EAB308" filter="drop-shadow(0 0 5px #EAB308)" />
    <text x="-70" y="5" font-family="monospace" font-size="11" font-weight="700" fill="#FDE047" letter-spacing="1">TASKBAR HOVER HUD</text>
  </g>
</svg>
