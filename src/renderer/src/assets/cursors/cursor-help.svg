<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <defs>
    <filter id="helpShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0.4" dy="0.7" stdDeviation="0.4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- macOS Black Pointer -->
  <path d="M 1 1 L 1 11.5 L 3.8 8.9 L 6.0 13.2 L 7.6 12.3 L 5.4 8.1 L 9.2 8.1 Z" 
        fill="#000000" 
        stroke="#FFFFFF" 
        stroke-width="1.0" 
        stroke-linejoin="miter" 
        stroke-miterlimit="2"
        stroke-linecap="round"
        filter="url(#helpShadow)"/>
  <!-- Question Badge -->
  <circle cx="12" cy="12" r="3.6" fill="#3B82F6" stroke="#FFFFFF" stroke-width="0.9"/>
  <text x="12" y="14.3" font-family="-apple-system, sans-serif" font-size="5.8" font-weight="900" fill="#FFFFFF" text-anchor="middle">?</text>
</svg>
