name: Build & Release One Tap Android App

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-release.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Override Version (leave empty for auto-increment starting at 26.11.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Auto-Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Release Version (Starting from 26.11.46.01)
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.manual_version }}" ]; then
            VERSION="${{ github.event.inputs.manual_version }}"
            echo "Using manual version: $VERSION"
          else
            # Find existing tags starting with v26.11.46.
            LATEST_TAG=$(git tag -l "v26.11.46.*" | sort -V | tail -n 1)
            if [ -z "$LATEST_TAG" ]; then
              VERSION="26.11.46.01"
              echo "No previous v26.11.46.* tags found. Starting at: $VERSION"
            else
              # Extract subpatch e.g. 01 and increment
              SUBPATCH=$(echo "$LATEST_TAG" | sed 's/v26\.11\.46\.//')
              NUM=$((10#$SUBPATCH + 1))
              NEXT_SUBPATCH=$(printf "%02d" $NUM)
              VERSION="26.11.46.$NEXT_SUBPATCH"
              echo "Previous tag: $LATEST_TAG -> Next version: $VERSION"
            fi
          fi

          # Compute integer versionCode e.g. 26.11.46.01 -> 26114601
          VERSION_CODE=$(echo "$VERSION" | tr -d '.')

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Update version.json manifest
        run: |
          DATE_NOW=$(date -u +"%Y-%m-%d")
          cat <<EOF > android-app/version.json
          {
            "version": "${{ env.VERSION }}",
            "versionCode": ${{ env.VERSION_CODE }},
            "releaseDate": "$DATE_NOW",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/OneTapStudio-v${{ env.VERSION }}.apk",
            "changelog": "Autonomous release build v${{ env.VERSION }}. Cloud Database Sync & Auto-Update Engine active."
          }
          EOF
          cat android-app/version.json

      - name: Build Android APK
        working-directory: android-app
        run: |
          gradle assembleDebug -PversionName="${{ env.VERSION }}" -PversionCode="${{ env.VERSION_CODE }}" --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-artifacts
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-artifacts/OneTapStudio-v${{ env.VERSION }}.apk
          ls -la release-artifacts

      - name: Create GitHub Release & Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.VERSION }}" \
            release-artifacts/OneTapStudio-v${{ env.VERSION }}.apk \
            android-app/version.json \
            --title "One Tap Studio Mobile v${{ env.VERSION }}" \
            --notes "### 🚀 One Tap Studio Mobile v${{ env.VERSION }}

          - **Autonomous Release Build**: Generated by GitHub Actions workflow.
          - **Cloud Database Sync**: Seamless real-time synchronization with Web & Electron Workstation.
          - **In-App Auto-Update**: One-Tap in-app update check and direct APK installation.
          - **AI Voice & Ingest Radar**: Speech synthesis briefing & live missing footage scanner.

          **Download APK below to install or update directly:**"

      - name: Commit Updated version.json to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-app/version.json
          git diff-index --quiet HEAD || git commit -m "chore(release): bump android version manifest to v${{ env.VERSION }} [skip ci]"
          git push origin main || echo "Branch push skipped or already up to date"
